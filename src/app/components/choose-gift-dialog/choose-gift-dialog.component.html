<div class="dialog-image"><img [src]="data.imagem" [alt]="data.nome"></div>
<div mat-dialog-content class="dialog-content"><span class="eyebrow">Um presente especial</span><h2>{{ data.nome }}</h2><p>{{ data.descricao }}</p><strong>{{ data.preco | currency:'BRL':'symbol':'1.2-2' }}</strong><mat-form-field appearance="outline"><mat-label>Seu nome</mat-label><input matInput [formControl]="form.controls.nomeConvidado" placeholder="Como podemos agradecer?"><mat-icon matPrefix>person_outline</mat-icon>@if (form.controls.nomeConvidado.hasError('required')) { <mat-error>Informe seu nome</mat-error> }</mat-form-field></div>
<div mat-dialog-actions align="end"><button mat-button mat-dialog-close>Cancelar</button><button mat-flat-button class="confirm-button" (click)="confirm()">Confirmar Escolha <mat-icon>favorite</mat-icon></button></div>
